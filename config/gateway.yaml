# 网关配置：修改后无需重启，运行时会检测文件变更并热加载
listen: ":9000"

auth:
  enabled: true
  # 生产环境从环境变量读取，这里仅作演示
  jwt_secret: "dev-secret-change-me"
  # 不需要鉴权的路径前缀
  whitelist:
    - "/health"
    - "/metrics"
    - "/public/"

rate_limit:
  # 每个客户端 IP 每秒允许的请求数
  rps: 50
  burst: 100

routes:
  - prefix: "/review"
    backends:
      - url: "http://127.0.0.1:8090"
        weight: 1
    # 后端不可用时的熔断参数
    breaker:
      failure_threshold: 5
      open_seconds: 10

  - prefix: "/public"
    backends:
      - url: "http://127.0.0.1:8090"
        weight: 1
    auth_required: false

log:
  # access / debug
  level: "access"
